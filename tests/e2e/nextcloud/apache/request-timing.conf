# Logs each honeycomb API request's start, duration and outcome to stderr, which Playwright prints, so a stalled one is traceable.
SetEnvIf Request_URI "^(/index\.php)?/apps/honeycomb/api/" honeycomb_api
LogFormat "[request] %{begin:%Y-%m-%dT%H:%M:%S}t.%{begin:msec_frac}t %{ms}T ms %>s %X %m %U" honeycomb_timing
GlobalLog /dev/stderr honeycomb_timing env=honeycomb_api
