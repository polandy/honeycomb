# SPDX-License-Identifier: AGPL-3.0-or-later

# Files that cannot carry their own SPDX header: agent files start with front matter, JSON has no
# comments, test fixtures must stay byte-exact, and docs, lock files and release-please outputs
# are covered here instead.
version = 1

[[annotations]]
path = [
    "AGENTS.md",
    "CLAUDE.md",
    "CHANGELOG.md",
    "README.md",
    "TODO.md",
    ".markdownlint-cli2.jsonc",
    ".release-please-manifest.json",
    "release-please-config.json",
    ".claude/settings.json",
    ".claude/commands/**",
    ".claude/skills/**",
    ".claude/agents/**",
    "docs/**",
    "tests/fixtures/**",
    "composer.json",
    "composer.lock",
    "package.json",
    "tsconfig.json",
    "package-lock.json",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 honeycomb contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"
