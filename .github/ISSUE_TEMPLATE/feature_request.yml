name: Feature request
description: Suggest a change or an addition.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do?
      description: The culling task you cannot do today, and on which device.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
      description: Optional. A sketch or an example from another program is welcome.
