# Title and description become the squash commit; `edited` reruns these checks without restarting CI.
name: Pull request message

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pull-request-message-${{ github.ref }}
  cancel-in-progress: true

jobs:
  title:
    name: conventional title
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: scripts/check-pr-title.sh
        # Passed as a variable, never interpolated into the script, so the title cannot inject commands.
        env:
          PULL_REQUEST_TITLE: ${{ github.event.pull_request.title }}
        run: scripts/check-pr-title.sh

  spec-trailers:
    name: spec trailers
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: scripts/spec-trailers.sh
        # Passed as variables, never interpolated into the script, so the text cannot inject commands.
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          PULL_REQUEST_TITLE: ${{ github.event.pull_request.title }}
          PULL_REQUEST_BODY: ${{ github.event.pull_request.body }}
          # Only same-repository branches count as release pull requests, so a fork cannot borrow the name.
          SPEC_HEAD_REF: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref || '' }}
        run: |
          set -o pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename' |
            SPEC_MESSAGE="$PULL_REQUEST_TITLE"$'\n\n'"$PULL_REQUEST_BODY" scripts/spec-trailers.sh
