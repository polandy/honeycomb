name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # A PAT lets CI run on the release PR; without the secret it falls back to GITHUB_TOKEN.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

  # Builds the release tarball; signs it and uploads it to the App Store once the secrets exist (docs/dev/releasing.md).
  package:
    name: package and publish
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - name: Package
        env:
          APP_SIGNING_KEY: ${{ secrets.APP_SIGNING_KEY }}
          APP_SIGNING_CERT: ${{ secrets.APP_SIGNING_CERT }}
        run: |
          if [ -n "$APP_SIGNING_KEY" ]; then
            keys=$(mktemp -d)
            printf '%s\n' "$APP_SIGNING_KEY" >"$keys/honeycomb.key"
            printf '%s\n' "$APP_SIGNING_CERT" >"$keys/honeycomb.crt"
            export HONEYCOMB_SIGNING_KEY=$keys/honeycomb.key HONEYCOMB_SIGNING_CERT=$keys/honeycomb.crt
          fi
          scripts/package.sh
      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" build/artifacts/* --clobber
      - name: Upload to the App Store
        env:
          APPSTORE_TOKEN: ${{ secrets.APPSTORE_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          if [ -z "$APPSTORE_TOKEN" ]; then
            echo "::notice::No APPSTORE_TOKEN secret: the release is on GitHub only."
            exit 0
          fi
          tarball=honeycomb-${TAG#v}.tar.gz
          [ -f "build/artifacts/$tarball.sig" ] || { echo "::error::$tarball is unsigned; set the signing secrets."; exit 1; }
          jq -n --arg download "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$tarball" \
            --rawfile signature "build/artifacts/$tarball.sig" '{download: $download, signature: $signature, nightly: false}' |
            curl --fail-with-body -sS -X POST https://apps.nextcloud.com/api/v1/apps/releases \
              -H "Authorization: Token $APPSTORE_TOKEN" -H 'Content-Type: application/json' --data @-
