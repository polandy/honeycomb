# One job per toolchain, same tools and versions as scripts/verify.sh.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: changed paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      markdown: ${{ steps.groups.outputs.markdown }}
      php: ${{ steps.groups.outputs.php }}
      ts: ${{ steps.groups.outputs.ts }}
      app: ${{ steps.groups.outputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - id: groups
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -n "$PR" ]; then
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename'
          fi | scripts/ci-changes.sh >> "$GITHUB_OUTPUT"

  markdown:
    name: markdownlint
    needs: changes
    if: needs.changes.outputs.markdown == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: "**/*.md"

  reuse:
    name: REUSE lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

  conventions:
    name: Convention gates
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/test-ci-changes.sh
      - run: scripts/test-source-sizes.sh
      - run: scripts/test-pins.sh
      - run: scripts/test-words.sh
      - run: scripts/test-specs.sh
      - run: scripts/test-spec-trailers.sh
      - run: scripts/test-nextcloud-versions.sh
      - run: scripts/test-e2e-image.sh
      - run: scripts/test-package.sh
      - run: scripts/test-verify-steps.sh
      - run: scripts/source-sizes.sh
      - run: scripts/pins.sh
      - run: scripts/words.sh
      - run: scripts/specs.sh
      - run: scripts/nextcloud-versions.sh

  php:
    name: PHP ${{ matrix.php }}
    needs: changes
    if: needs.changes.outputs.php == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        php: ['8.3', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none
      - id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-
      - run: composer install --no-interaction --no-progress
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ github.token }}"}}'
      - if: matrix.php == '8.3'
        run: vendor/bin/php-cs-fixer fix --dry-run --diff
      - run: vendor/bin/psalm --no-cache --threads=1 --no-progress
      - run: vendor/bin/phpunit

  php-db:
    name: PHP mappers on ${{ matrix.db }}
    needs: changes
    if: needs.changes.outputs.php == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, mariadb, postgres]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          coverage: none
          tools: none
      - id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-8.5-${{ hashFiles('composer.lock') }}
          restore-keys: composer-8.5-
      - run: composer install --no-interaction --no-progress
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ github.token }}"}}'
      - run: scripts/php-db-tests.sh
        env:
          HONEYCOMB_DB: ${{ matrix.db }}

  typescript:
    name: TypeScript
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: scripts/unused-exports.sh
      - run: npx eslint
      - run: npx vue-tsc
      - run: npx vitest run --coverage

  xmp-interop:
    name: XMP read back with ExifTool and Exiv2
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: scripts/xmp-interop.sh

  e2e:
    name: Build and e2e on the ${{ matrix.nextcloud }} Nextcloud, shard ${{ matrix.shard }}
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        nextcloud: [oldest, newest]
        # Each shard runs on its own runner, so it starts its own Nextcloud.
        shard: [1/3, 2/3, 3/3]
    env:
      HONEYCOMB_E2E_NEXTCLOUD: ${{ matrix.nextcloud }}
      HONEYCOMB_E2E_WEBKIT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - id: modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: node-modules-node24-${{ hashFiles('package-lock.json') }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci
      - run: npx vite build
      - id: webkit
        run: |
          tests=$(npx playwright test --list --shard=${{ matrix.shard }})
          if grep -q '\[webkit\]' <<< "$tests"; then echo "needed=true" >> "$GITHUB_OUTPUT"; fi
      # The runner user cannot write apt's archive directory, so the cache holds a copy of it.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/webkit-apt
          key: playwright-webkit-${{ steps.webkit.outputs.needed == 'true' }}-${{ hashFiles('package-lock.json') }}
      # The runner image already has Chrome's system libraries; apt mirrors answering 503 failed the job.
      - run: npx playwright install chromium
      # WebKit's system libraries are not on the runner image; the slow apt mirror stalled the job at 20 minutes.
      - if: steps.webkit.outputs.needed == 'true'
        run: |
          mkdir -p ~/webkit-apt
          find ~/webkit-apt -name '*.deb' -exec sudo cp -t /var/cache/apt/archives/ {} +
          npx playwright install --with-deps webkit
          find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec cp -t ~/webkit-apt/ {} +
        timeout-minutes: 10
      - run: npx playwright test --shard=${{ matrix.shard }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces-${{ matrix.nextcloud }}-${{ strategy.job-index }}
          path: test-results/
          retention-days: 7

  gate:
    name: CI gate
    needs: [changes, markdown, reuse, conventions, php, php-db, typescript, xmp-interop, e2e]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          case " $RESULTS " in *" failure "* | *" cancelled "*) exit 1 ;; esac
