<!-- Concept mockup for tags (docs/07-tags.md); merges into index.html once the owner signs it off. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>honeycomb tags mockup</title>
<link rel="icon" href="data:,">
<style>
:root{
  --honey:#F4A51C; --on-honey:#1b1b1b; --bg:#f7f7f7; --card:#ffffff; --card-2:#f0f0f0; --text:#1b1b1b; --muted:#5e5e5e;
  --border:#dcdcdc; --honey-soft:#fdecc8; --honey-text:#8a5600; --focus:#1a62d6; --scrim:rgba(0,0,0,.5);
  --shadow:0 4px 18px rgba(0,0,0,.14); --tile-bg:#e6e6e6; --stage:#111111; --stage-text:#f2f2f2; --stage-muted:#b0b0b0;
  --hdr-bg:#ffffff; --hdr-line:#dcdcdc; --hit:44px; color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#161616; --card:#222222; --card-2:#2c2c2c; --text:#f2f2f2; --muted:#a6a6a6; --border:#3a3a3a; --honey-soft:#3d2e0e;
    --honey-text:#f7b94a; --focus:#8ab4ff; --scrim:rgba(0,0,0,.65); --shadow:0 4px 22px rgba(0,0,0,.5); --tile-bg:#2c2c2c;
    --hdr-bg:#1b1b1b; --hdr-line:rgba(255,255,255,.3); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#161616; --card:#222222; --card-2:#2c2c2c; --text:#f2f2f2; --muted:#a6a6a6; --border:#3a3a3a; --honey-soft:#3d2e0e;
  --honey-text:#f7b94a; --focus:#8ab4ff; --scrim:rgba(0,0,0,.65); --shadow:0 4px 22px rgba(0,0,0,.5); --tile-bg:#2c2c2c;
  --hdr-bg:#1b1b1b; --hdr-line:rgba(255,255,255,.3); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden}
#app{flex:1;display:flex;flex-direction:column;min-height:0}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.hdr{flex:none;display:flex;align-items:center;gap:8px;padding:6px 12px;background:var(--hdr-bg);border-bottom:1px solid var(--hdr-line)}
.hdr h1{font-size:17px;margin:0 auto 0 4px}
.btn{min-height:var(--hit);padding:0 14px;border-radius:10px;border:1px solid var(--border);background:var(--card);display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.btn.primary{background:var(--honey);border-color:var(--honey);color:var(--on-honey);font-weight:600}
.btn[aria-pressed="true"]{background:var(--honey-soft);border-color:var(--honey)}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--card-2);font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.btn[aria-pressed="true"] .badge{background:var(--honey);color:var(--on-honey)}
kbd{font:600 12px ui-monospace,monospace;border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--card-2)}
.filters{flex:none;margin:8px 12px 6px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:8px 12px;display:flex;flex-wrap:wrap;gap:6px 18px}
.fg{display:flex;flex-direction:column;gap:4px;min-width:0}
.fg>span{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.fg .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{min-height:var(--hit);padding:0 12px;border-radius:22px;border:1px solid var(--border);background:var(--card-2);display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--honey);border-color:var(--honey);color:var(--on-honey);font-weight:700}
.chip small{color:var(--muted);font-weight:400}.chip[aria-pressed="true"] small{color:inherit}
.chip .par{color:var(--muted)}.chip[aria-pressed="true"] .par{color:inherit;opacity:.75}
.sw{width:26px;height:26px;border-radius:50%;display:inline-block;border:2px solid rgba(127,127,127,.5)}
.field{min-height:var(--hit);border:1px solid var(--border);border-radius:10px;background:var(--card);padding:0 12px;display:flex;align-items:center;gap:8px}
.field input{border:0;background:transparent;outline:0;flex:1;min-width:60px;min-height:40px}
.wrap{flex:1;overflow:auto;padding:4px 12px 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tile{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--tile-bg)}
.tile .ph{position:absolute;inset:0}
.tile .pair{position:absolute;left:6px;top:6px;font-size:11px;font-weight:700;border-radius:6px;padding:2px 6px;background:rgba(0,0,0,.45);color:#fff}
.tile .ov{position:absolute;left:0;right:0;bottom:0;padding:16px 6px 5px;background:linear-gradient(transparent,rgba(0,0,0,.7));display:flex;align-items:center;gap:6px;color:#fff;font-size:12px}
.tile .tg{margin-left:auto;display:inline-flex;align-items:center;gap:2px}
.tile .chk{position:absolute;right:6px;top:6px;width:26px;height:26px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.25)}
.tile.sel{box-shadow:0 0 0 3px var(--honey) inset}.tile.sel .chk{background:var(--honey)}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.selbar{flex:none;display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--card);border-top:1px solid var(--border)}
.selbar b{margin-right:auto}
.loupe{flex:1;display:flex;background:var(--stage);color:var(--stage-text);min-height:0}
.stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;min-width:0}
.stage .photo{width:min(86%,900px);aspect-ratio:3/2;border-radius:4px}
.info{width:300px;flex:none;background:#1b1b1b;border-left:1px solid #333;padding:14px;overflow:auto;font-size:14px}
.info h2{font-size:13px;color:var(--stage-muted);text-transform:uppercase;letter-spacing:.04em;margin:16px 0 6px}
.info .tagl{display:flex;flex-wrap:wrap;gap:6px}
.info .tagl>span{border:1px solid #444;border-radius:14px;padding:3px 10px}
.info .tagl .par{color:var(--stage-muted)}
.scrim{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:flex-start;justify-content:center;padding-top:9vh}
.sheet{width:min(560px,calc(100% - 32px));background:var(--card);color:var(--text);border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;max-height:80vh}
@media (max-width:820px){ .scrim{align-items:flex-end;padding-top:0} .sheet{width:100%;border-radius:14px 14px 0 0;max-height:72vh} .info{display:none} }
.sheet header{display:flex;align-items:center;gap:8px;padding:12px 14px 6px}
.sheet header h2{font-size:16px;margin:0 auto 0 0}
.sheet .body{padding:4px 14px 14px;overflow:auto;display:flex;flex-direction:column;gap:10px}
.cur{display:flex;flex-wrap:wrap;gap:6px}
.tchip{min-height:36px;border-radius:18px;padding:0 4px 0 12px;display:inline-flex;align-items:center;gap:4px;border:1px solid var(--honey);background:var(--honey-soft)}
.tchip.some{background:transparent;border-style:dashed;border-color:var(--muted)}
.tchip .par{color:var(--muted)}
.tchip .n{font-size:12px;color:var(--muted);margin-left:2px}
.tchip button{width:32px;height:32px;border-radius:16px;border:0;background:transparent;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.sugg{list-style:none;margin:0;padding:0;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.sugg li{min-height:var(--hit);display:flex;align-items:center;gap:8px;padding:0 12px;border-top:1px solid var(--border);cursor:pointer}
.sugg li:first-child{border-top:0}
.sugg li[aria-selected="true"]{background:var(--honey-soft)}
.sugg .par{color:var(--muted)}.sugg mark{background:none;color:inherit;font-weight:700;text-decoration:underline}
.sugg .cnt{margin-left:auto;color:var(--muted);font-size:13px}
.hint{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}
.sect{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:#1b1b1b;color:#fff;border-radius:10px;padding:10px 14px;display:flex;gap:14px;box-shadow:var(--shadow)}
.toast b{color:var(--honey)}
.views{position:fixed;right:8px;bottom:8px;display:flex;gap:4px;font-size:12px;opacity:.85}
.views a{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:2px 6px;color:var(--text);text-decoration:none}
body.shot .views{display:none}
</style>
</head>
<body>
<div id="app"></div>
<nav class="views" aria-label="Mockup states">
  <a href="#filter">Tag filter</a><a href="#entry">Tag entry</a><a href="#bulk">Bulk tagging</a><a href="#loupe">Loupe tags</a>
</nav>
<script>
'use strict';
/* tag paths as digiKam's TagsList writes them; counts are pictures in the folder set */
const TAGS = [
  ['Places/Italy/Dolomites', 38], ['Places/Italy/Dolomites/Seceda', 14], ['Places/Italy/Dolomites/Tre Cime', 9],
  ['Places/Italy/Bolzano', 6], ['Places/Portugal/Lisbon', 0], ['People/Anna', 12], ['People/Ben', 4],
  ['Events/Wedding 2026', 0], ['Subjects/Landscape', 41], ['Subjects/Mountains', 33], ['Subjects/Sunrise', 7]
];
const RECENT = ['Places/Italy/Dolomites/Seceda', 'Subjects/Sunrise', 'People/Anna'];
const IC = {
  tag:'M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8ZM7.5 7.5h.01',
  x:'M6 6l12 12M18 6 6 18', plus:'M12 5v14M5 12h14', filter:'M3 5h18l-7 8v6l-4 2v-8z', check:'M5 12l5 5 9-10',
  back:'M15 18l-6-6 6-6', info:'M12 8h.01M11 12h1v5h1M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18Z'
};
const ic = n => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="${IC[n]}"/></svg>`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;'}[c]));
/* a tag path shown as muted parents and the leaf, the way every tag control renders it */
function path(p, q = ''){
  const parts = p.split('/'), leaf = parts.pop(), par = parts.length ? `<span class="par">${esc(parts.join(' › '))} › </span>` : '';
  if (!q) return par + esc(leaf);
  const i = leaf.toLowerCase().indexOf(q.toLowerCase());
  return par + (i < 0 ? esc(leaf) : esc(leaf.slice(0, i)) + `<mark>${esc(leaf.slice(i, i + q.length))}</mark>` + esc(leaf.slice(i + q.length)));
}
/* ranking: leaf starts with the query, then a word of the leaf, then anywhere in the path */
function suggest(q){
  const s = q.trim().toLowerCase(); if (!s) return [];
  const rank = p => { const leaf = p.split('/').pop().toLowerCase();
    return leaf.startsWith(s) ? 0 : leaf.split(/[\s-]/).some(w => w.startsWith(s)) ? 1 : p.toLowerCase().includes(s) ? 2 : 9; };
  return TAGS.map(([p, c]) => ({p, c, r:rank(p)})).filter(x => x.r < 9).sort((a, b) => a.r - b.r || b.c - a.c || a.p.localeCompare(b.p)).slice(0, 6);
}
const HUES = [205, 30, 140, 260, 10, 180, 90, 320, 45, 220, 160, 0];
const photo = i => `background:linear-gradient(${(i * 37) % 360}deg,hsl(${HUES[i % 12]} 35% 42%),hsl(${(HUES[i % 12] + 40) % 360} 30% 70%))`;
function tiles(sel){
  let h = '';
  for (let i = 0; i < 18; i++){
    const tagged = [0, 1, 2, 4, 5, 8, 9, 11, 12, 15].includes(i), s = sel && sel.has(i);
    h += `<div class="tile${s ? ' sel' : ''}" role="gridcell" aria-label="DSC_${4100 + i}${tagged ? ', tagged' : ''}"><div class="ph" style="${photo(i)}"></div><span class="pair">NEF+JPG</span>${sel ? '<span class="chk"></span>' : ''}<div class="ov"><span style="color:#ffc93c">${'★'.repeat(i % 4)}</span>${tagged ? `<span class="tg" aria-hidden="true">${ic('tag')}${(i % 3) + 1}</span>` : ''}</div></div>`;
  }
  return `<div class="grid" role="grid">${h}</div>`;
}
const header = (title, extra = '') => `<div class="hdr"><button class="btn" aria-label="Back">${ic('back')}</button><h1>${esc(title)}</h1>${extra}</div>`;
function filterBar(){
  const tagChip = (p, c, on) => `<button class="chip" aria-pressed="${on}">${path(p)} <small>${c}</small></button>`;
  return `<div class="filters" role="region" aria-label="Filters">
    <div class="fg"><span>Rating</span><div class="row"><button class="chip" aria-pressed="true">Any</button><button class="chip">≥</button>${[1, 2, 3, 4, 5].map(n => `<button class="chip" aria-pressed="false">${n}★</button>`).join('')}</div></div>
    <div class="fg"><span>Colour</span><div class="row">${['#d33', '#e8c32a', '#3a3', '#36c'].map(c => `<button class="chip" aria-pressed="false" style="padding:0 9px"><i class="sw" style="background:${c}"></i></button>`).join('')}</div></div>
    <div class="fg" style="flex:1 1 380px"><span>Tags</span>
      <div class="row"><label class="field" style="flex:1 1 200px">${ic('tag')}<input placeholder="Find a tag" aria-label="Find a tag" value=""></label></div>
      <div class="row">${tagChip('Places/Italy/Dolomites', 38, true)}${tagChip('People/Anna', 12, true)}${tagChip('Subjects/Sunrise', 7, false)}${tagChip('Subjects/Landscape', 41, false)}<button class="chip" aria-pressed="false">Untagged <small>61</small></button><button class="chip" aria-pressed="false">More…</button></div>
    </div></div>`;
}
function tagSheet({title, chips, q = '', recent = false, foot}){
  const list = suggest(q);
  const exact = TAGS.some(([p]) => p.toLowerCase() === q.trim().toLowerCase());
  const rows = list.map((x, i) => `<li role="option" aria-selected="${i === 0}">${ic('tag')}<span>${path(x.p, q.trim())}</span><span class="cnt">${x.c}</span></li>`).join('')
    + (q.trim() && !exact ? `<li role="option" aria-selected="${!list.length}">${ic('plus')}<span>Create tag <b>${path(q.trim())}</b></span></li>` : '');
  const rec = recent ? `<div class="sect">Recent</div><div class="cur">${RECENT.map(p => `<button class="chip" aria-pressed="false">${path(p)}</button>`).join('')}</div>` : '';
  return `<div class="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <header><h2>${esc(title)}</h2><button class="btn" aria-label="Close">${ic('x')}</button></header>
    <div class="body">
      <div class="cur" aria-label="Tags">${chips}</div>
      <label class="field">${ic('tag')}<input id="q" role="combobox" aria-expanded="${!!rows}" aria-controls="sl" aria-label="Add a tag" placeholder="Add a tag, / for a level" value="${esc(q)}"></label>
      ${rows ? `<ul class="sugg" id="sl" role="listbox">${rows}</ul>` : ''}${rec}
      <div class="hint"><span><kbd>↑</kbd> <kbd>↓</kbd> choose</span><span><kbd>Tab</kbd> complete a level</span><span><kbd>Enter</kbd> add</span><span><kbd>Backspace</kbd> remove the last tag</span><span><kbd>Esc</kbd> done</span></div>
      ${foot || ''}
    </div></div></div>`;
}
const tchip = (p, n) => `<span class="tchip${n ? ' some' : ''}">${path(p)}${n ? `<span class="n">${n}</span>` : ''}<button aria-label="${n ? 'Add to all, or remove from' : 'Remove'} ${esc(p)}">${n ? ic('plus') : ic('x')}</button></span>`;
const VIEWS = {
  filter: () => header('Dolomites', `<button class="btn" aria-pressed="true">${ic('filter')}Filters <span class="badge">2</span></button><button class="btn">Select</button>`)
    + filterBar() + `<div class="wrap">${tiles()}</div>`,
  entry: () => `<div class="loupe"><div class="stage"><div class="photo" style="${photo(3)}"></div></div><aside class="info"><b>DSC_4103</b></aside></div>`
    + tagSheet({title:'Tags · DSC_4103', chips:tchip('Places/Italy/Dolomites/Seceda') + tchip('Subjects/Mountains'), q:'sun'}),
  bulk: () => header('Dolomites', '<button class="btn" aria-pressed="true">Select</button>') + `<div class="wrap">${tiles(new Set([0, 1, 2, 4, 5, 6, 8]))}</div>`
    + `<div class="selbar"><b>7 selected</b><button class="btn">${ic('tag')}Tags <kbd>T</kbd></button></div>`
    + tagSheet({title:'Tags · 7 photos', chips:tchip('Places/Italy/Dolomites') + tchip('Subjects/Mountains', '4 of 7') + tchip('People/Anna', '2 of 7'), recent:true,
      foot:'<div class="hint">A solid tag is on every selected photo; a dashed one on some. <span>+ adds it to all, × removes it from all.</span></div>'}),
  loupe: () => `<div class="loupe"><div class="stage"><div class="photo" style="${photo(3)}"></div></div><aside class="info" aria-label="Info panel">
    <b>DSC_4103.NEF + JPG</b><h2>Decision</h2>★★★ · Picked<h2>Tags <kbd style="color:var(--text)">T</kbd></h2>
    <div class="tagl"><span>${path('Places/Italy/Dolomites/Seceda')}</span><span>${path('Subjects/Mountains')}</span><span>${path('Subjects/Sunrise')}</span></div>
    <h2>Written to</h2>DSC_4103.NEF.xmp<br>DSC_4103.JPG.xmp</aside></div>
    <div class="toast" role="status">Tagged DSC_4103 Sunrise <b>Undo</b></div>`
};
function render(){
  const v = VIEWS[location.hash.slice(1)] ? location.hash.slice(1) : 'filter';
  document.getElementById('app').innerHTML = VIEWS[v]();
  const q = document.getElementById('q');
  if (q){ q.focus(); q.setSelectionRange(q.value.length, q.value.length);
    q.addEventListener('input', () => { const sl = document.querySelector('.sugg'), tmp = document.createElement('div');
      tmp.innerHTML = tagSheet({title:'', chips:'', q:q.value}); const nl = tmp.querySelector('.sugg');
      if (sl && nl) sl.replaceWith(nl); else if (sl) sl.remove(); else if (nl) q.closest('.field').after(nl); }); }
}
document.body.classList.toggle('shot', new URLSearchParams(location.search).has('shot'));
addEventListener('hashchange', render); render();
</script>
</body>
</html>
