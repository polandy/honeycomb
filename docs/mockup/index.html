<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>honeycomb mockup</title>
<link rel="icon" href="data:,">
<style>
:root{
  --ink:#1b1b1b; --paper:#f7f7f7; --honey:#F4A51C; --on-honey:#1b1b1b; --honey-hover:#e29610;
  --bg:#f7f7f7; --bg-nav:#ffffff; --card:#ffffff; --card-2:#f0f0f0; --text:#1b1b1b; --muted:#5e5e5e;
  --border:#dcdcdc; --honey-soft:#fdecc8; --honey-text:#8a5600; --danger:#c62f2b; --danger-soft:#fde4e2;
  --ok:#1f8a4c; --ok-soft:#dff3e6; --warn-bg:#ffe3dc; --warn-text:#a52f14; --focus:#1a62d6; --scrim:rgba(0,0,0,.5);
  --shadow:0 4px 18px rgba(0,0,0,.14); --tile-bg:#e6e6e6; --tile-skel:#d2d2d2;
  --stage:#111111; --stage-2:#1a1a1a; --stage-text:#f2f2f2; --stage-muted:#b0b0b0; --pick-fill:#1f7a46; --reject-fill:#b3302c;
  --tip-bg:#1b1b1b; --tip-fg:#ffffff; --tip-edge:#ffffff40;
  --hit:44px; --ic:22px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#161616; --bg-nav:#1c1c1c; --card:#222222; --card-2:#2c2c2c; --text:#f2f2f2; --muted:#a6a6a6;
    --border:#3a3a3a; --honey-soft:#3d2e0e; --honey-text:#f7b94a; --danger:#ef6b66; --danger-soft:#43201e;
    --ok:#5fcf8a; --ok-soft:#1c3a28; --warn-bg:#4a2018; --warn-text:#ffb4a2; --focus:#8ab4ff; --scrim:rgba(0,0,0,.65);
    --shadow:0 4px 22px rgba(0,0,0,.5); --tile-bg:#2c2c2c; --tile-skel:#3d3d3d; --tip-bg:#f2f2f2; --tip-fg:#1b1b1b; --tip-edge:#00000040; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#161616; --bg-nav:#1c1c1c; --card:#222222; --card-2:#2c2c2c; --text:#f2f2f2; --muted:#a6a6a6;
  --border:#3a3a3a; --honey-soft:#3d2e0e; --honey-text:#f7b94a; --danger:#ef6b66; --danger-soft:#43201e;
  --ok:#5fcf8a; --ok-soft:#1c3a28; --warn-bg:#4a2018; --warn-text:#ffb4a2; --focus:#8ab4ff; --scrim:rgba(0,0,0,.65);
  --shadow:0 4px 22px rgba(0,0,0,.5); --tile-bg:#2c2c2c; --tile-skel:#3d3d3d; --tip-bg:#f2f2f2; --tip-fg:#1b1b1b; --tip-edge:#00000040; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Helvetica Neue",Arial,sans-serif;overscroll-behavior:none}
body{overflow:hidden;-webkit-text-size-adjust:100%}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
svg.ic.fill{fill:currentColor}
svg.ic{width:var(--ic);height:var(--ic);fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

#host{height:100vh;height:100dvh;display:flex;align-items:center;justify-content:center;overflow:hidden}
#host.framed{background:repeating-linear-gradient(45deg,#2a2a2a 0 10px,#252525 10px 20px)}
#frame{--sa-t:env(safe-area-inset-top);--sa-r:env(safe-area-inset-right);--sa-b:env(safe-area-inset-bottom);--sa-l:env(safe-area-inset-left);position:relative;width:100vw;height:100vh;height:100dvh;overflow:hidden;background:var(--bg);container:app/size;flex:none;
  display:flex;flex-direction:column}
#host.framed #frame{border-radius:22px;box-shadow:0 0 0 10px #000,0 20px 60px rgba(0,0,0,.6)}
#frame[data-cam]::after{content:"";position:absolute;width:10px;height:10px;margin:-5px;border-radius:50%;background:#111;box-shadow:0 0 0 2px #444;z-index:300;pointer-events:none}
#frame[data-cam~="top"]::after{top:0;left:50%}#frame[data-cam~="bottom"]::after{bottom:0;left:50%}#frame[data-cam~="left"]::after{left:0;top:50%}#frame[data-cam~="right"]::after{right:0;top:50%}
#frame[data-cam~="punch"]::after{width:14px;height:14px;margin:-7px;inset:auto}
#frame[data-cam="top punch"]::after{top:34px;left:50%}#frame[data-cam="right punch"]::after{right:34px;left:auto;top:50%}

/* header */
.hdr{flex:none;background:var(--ink);color:var(--paper);display:flex;align-items:center;gap:4px;
  height:calc(52px + var(--sa-t));padding:var(--sa-t) calc(204px + var(--sa-r)) 0 calc(6px + var(--sa-l));z-index:30}
.nohdr .hdr{display:none}
.hdr .icon-btn{color:var(--paper)}
.hdr .icon-btn:disabled{opacity:.35}
.logo{display:flex;align-items:center;gap:8px;font-weight:600;font-size:19px;letter-spacing:.2px;padding:0 8px}
.logo svg{width:32px;height:32px}
.hdr{position:relative}
.hdr .sp{flex:1}

.icon-btn{width:var(--hit);height:var(--hit);border-radius:10px;border:0;background:transparent;display:inline-flex;align-items:center;justify-content:center;position:relative}
.icon-btn:active{background:rgba(127,127,127,.22)}
.btn{min-height:var(--hit);padding:0 16px;border-radius:10px;border:1px solid var(--border);background:var(--card);display:inline-flex;align-items:center;gap:8px;
  justify-content:center;font-weight:500;white-space:nowrap;position:relative}
.btn:active{filter:brightness(.93)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--honey);border-color:var(--honey);color:var(--on-honey);font-weight:600}
.btn.primary:active{background:var(--honey-hover)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff;font-weight:600}
.btn.ghost{background:transparent}
.btn[aria-pressed="true"]{background:var(--honey-soft);border-color:var(--honey);color:var(--text)}
.badge-n{min-width:20px;height:20px;border-radius:10px;background:var(--honey);color:var(--on-honey);font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;padding:0 5px}


/* layout */
.body{flex:1;display:flex;min-height:0;position:relative}
nav#nav{width:var(--navw,248px);flex:none;background:var(--bg-nav);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:8px 8px calc(8px + var(--sa-b)) calc(8px + var(--sa-l));
  transition:margin-left .2s,transform .2s;z-index:20}
#frame[data-nav="closed"] nav#nav{margin-left:calc(-1px - var(--navw,248px))}
#frame[data-nav="closed"] #navDiv{display:none}
nav a{display:flex;align-items:center;gap:12px;min-height:var(--hit);padding:0 12px;border-radius:10px;color:inherit;text-decoration:none;border:0;background:none;width:100%;text-align:left}
nav a.active{background:var(--honey-soft);font-weight:600}
nav .sp{flex:1}
nav .sect{font-size:12px;color:var(--muted);padding:14px 12px 4px;text-transform:uppercase;letter-spacing:.6px}
#navScrim{display:none}
nav a.rc{flex-direction:column;align-items:flex-start;justify-content:center;gap:0;padding:4px 12px;min-height:48px}
nav a.rc.cur{background:var(--honey-soft)}
.rc-n{font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rc-m{font-size:12px;color:var(--muted)}
@container app (max-width:999px){
  nav#nav{position:absolute;left:0;top:0;bottom:0;box-shadow:var(--shadow);margin-left:0!important;transform:translateX(0)}
  #frame[data-nav="closed"] nav#nav{transform:translateX(-110%);box-shadow:none}
  #frame[data-nav="open"] #navScrim{display:block;position:absolute;inset:0;background:var(--scrim);z-index:19}
}
main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.toolbar{flex:none;padding:10px calc(12px + var(--sa-r)) 6px calc(12px + var(--sa-l));display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.crumbs{display:flex;align-items:center;flex-wrap:wrap;gap:0;flex:1;min-width:0}
.crumbs button{min-height:var(--hit);min-width:var(--hit);padding:0 8px;border:0;background:none;border-radius:8px;font-size:16px;white-space:nowrap}
.crumbs button:last-of-type{font-weight:700}
.crumbs .sep{color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{min-width:var(--hit);min-height:var(--hit);border:0;background:transparent;padding:0 12px;border-right:1px solid var(--border);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.seg button:last-child{border-right:0}
.seg .cmp{font-size:20px;font-weight:700;min-width:var(--hit)}
.seg .cmp:disabled{opacity:.4}
.seg button[aria-pressed="true"],.seg button[aria-checked="true"]{background:var(--honey);color:var(--on-honey);font-weight:700}
.sel-input{min-height:var(--hit);border-radius:10px;border:1px solid var(--border);background:var(--card);padding:0 10px}
.grow{flex:1}
.selrow{background:var(--honey-soft);border:1px solid var(--honey);border-radius:12px;padding:4px 8px 4px 14px}
.selrow b{margin-right:auto}

/* filter bar */
.filters{flex:none;margin:8px calc(12px + var(--sa-r)) 6px calc(12px + var(--sa-l));background:var(--card);border:1px solid var(--border);border-radius:12px;padding:8px 12px;display:flex;flex-wrap:wrap;gap:6px 18px;align-items:flex-start}
.fgroup{display:flex;flex-direction:column;gap:2px}
.fgroup>.lbl{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.fgroup>.chips{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.chip{min-height:var(--hit);min-width:var(--hit);padding:0 12px;border-radius:calc(var(--hit) / 2);border:1px solid var(--border);background:var(--card-2);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--honey);border-color:var(--honey);color:var(--on-honey);font-weight:700}
.chip.sw{padding:0;width:var(--hit);border-radius:50%;background:transparent;border-color:transparent}
.chip.sw .dotx{width:26px;height:26px;border-radius:50%;border:2px solid rgba(127,127,127,.5)}
.chip.sw[aria-pressed="true"]{background:transparent;box-shadow:0 0 0 3px var(--honey) inset}
.fright{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;align-self:flex-end}
.count{font-weight:700;font-variant-numeric:tabular-nums}
.dotc{display:inline-block;width:12px;height:12px;border-radius:50%;border:1.5px solid rgba(255,255,255,.85);box-shadow:0 0 0 1px rgba(0,0,0,.35)}

/* resizable areas */
.divider{flex:none;width:10px;margin:0 -5px;cursor:col-resize;touch-action:none;position:relative;z-index:21;background:transparent}
.divider::after{content:"";position:absolute;left:4px;top:0;bottom:0;width:2px;background:var(--border)}
.divider:hover::after,.divider.drag::after,.divider:focus-visible::after{background:var(--honey);width:4px;left:3px}
.divider:focus-visible{outline:none}
@container app (max-width:999px){#navDiv{display:none}}
.tsr{display:inline-flex;align-items:center;gap:6px}
.tsr input[type=range]{width:140px;min-height:var(--hit);accent-color:var(--honey);touch-action:none}
.tsr svg.ic{width:16px;height:16px}
#loupe .l-main{flex:1;display:flex;min-height:0}
#loupe .l-main #stage{flex:1;min-width:0}
#infoPanel{flex:none;width:var(--infow,300px);background:var(--stage-2);border-left:1px solid #ffffff1a;overflow:auto;padding:12px 14px;font-size:14px}
#infoPanel h4{margin:0 0 8px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
#infoPanel dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px}
#infoPanel dt{color:var(--muted)}#infoPanel dd{margin:0;overflow-wrap:anywhere}
#loupe .l-main .divider::after{background:#ffffff2a}
#loupe.immersive .l-top,#loupe.immersive .film,#loupe.immersive .l-ctrl,#loupe.immersive #infoPanel,#loupe.immersive #infoDiv,#loupe.immersive .navbtn{display:none}
#loupe.immersive #stage{cursor:none}
/* grid */
.grid-wrap{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:4px calc(12px + var(--sa-r)) 16px calc(12px + var(--sa-l));min-height:0;position:relative}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--ts,160px),1fr));gap:8px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.tile{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--tile-bg);contain:layout paint style;content-visibility:auto;contain-intrinsic-size:auto 160px;cursor:pointer;outline-offset:-3px}
.tile img.th{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;-webkit-user-drag:none;opacity:0;transition:opacity .2s}
.tile img.th.ld{opacity:1}
/* skeleton: a tile pulses until its thumbnail has loaded; reduced motion keeps it still */
.tile.wait,.tile.sk{animation:skel 1.2s ease-in-out infinite alternate}
.tile.sk{cursor:default}.tile.wait .ov{background:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
@keyframes skel{to{background:var(--tile-skel)}}
.tile .amb{position:absolute;left:6px;top:30px;min-width:20px;height:20px;border-radius:10px;background:var(--warn-bg);color:var(--warn-text);font-size:12px;font-weight:800;display:inline-flex;align-items:center;justify-content:center}
.grid .note{grid-column:1/-1;margin:0}
.tile .pair{position:absolute;left:6px;top:6px;font-size:11px;font-weight:700;border-radius:6px;padding:2px 6px;line-height:1.3}
.pair.p{background:rgba(0,0,0,.55);color:#fff;font-weight:600}
.pair.s{background:var(--warn-bg);color:var(--warn-text);border:1px dashed var(--warn-text)}
.tile .ov{position:absolute;left:0;right:0;bottom:0;padding:16px 6px 5px;background:linear-gradient(transparent,rgba(0,0,0,.7));display:flex;align-items:center;gap:6px;color:#fff;font-size:12px}
.tile .stars{letter-spacing:-1px;font-size:12px;white-space:nowrap}
.stars .on{color:#ffc93c}.stars .off{color:rgba(255,255,255,.35)}
.tile .flw{margin-left:auto;display:inline-flex}
.fl{width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center}
.tile .fl svg{width:20px;height:20px;stroke-width:2.2}.fl.pick{color:#fff}.fl.reject{color:#ff8f87}
.tile.rej img.th{opacity:.35}.tile.rej .rejx{display:flex}
.rejx{display:none;position:absolute;inset:0;align-items:center;justify-content:center;color:#fff;filter:drop-shadow(0 1px 6px rgba(0,0,0,.6));pointer-events:none}
.rejx svg{width:48px;height:48px;stroke-width:1.5}
.tile .chk{position:absolute;right:6px;top:6px;width:26px;height:26px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.25);display:none;align-items:center;justify-content:center;color:var(--on-honey)}
.tile .chk svg{width:16px;height:16px;stroke-width:3;opacity:0}
.selmode .tile .chk{display:flex}
.tile.sel{box-shadow:inset 0 0 0 4px var(--honey)}
.tile.sel .chk{background:var(--honey);border-color:var(--honey)}.tile.sel .chk svg{opacity:1}
.tile:focus-visible{outline:3px solid var(--focus)}
.empty{padding:60px 20px;text-align:center;color:var(--muted)}
.empty .big{font-size:18px;color:var(--text);font-weight:600;margin-bottom:6px}

/* action bar */
.actionbar{flex:none;background:var(--card);border-top:1px solid var(--border);padding:8px calc(12px + var(--sa-r)) calc(8px + var(--sa-b)) calc(12px + var(--sa-l));display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;box-shadow:0 -4px 14px rgba(0,0,0,.08)}
.grp{display:flex;align-items:center;gap:4px}
.gl{font-size:12px;color:var(--muted);margin-right:2px}
.sq.fb.pick svg{color:var(--ok)}.sq.fb.reject svg{color:var(--danger)}
.sq.fb.pick[aria-pressed="true"]{background:var(--pick-fill);border-color:var(--pick-fill);color:#fff}.sq.fb.reject[aria-pressed="true"]{background:var(--reject-fill);border-color:var(--reject-fill);color:#fff}
.sq.fb[aria-pressed="true"] svg{color:inherit}
.sq{min-width:var(--hit);height:var(--hit);border-radius:10px;border:1px solid var(--border);background:var(--card-2);padding:0 8px;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.sq[aria-pressed="true"]{background:var(--honey);border-color:var(--honey);color:var(--on-honey)}
.pair.p.k{background:var(--honey);color:var(--on-honey)}
.sq.fb.none[aria-pressed="true"]{background:var(--card);border:2px solid var(--text);color:var(--text)}.l-ctrl .sq.fb.none[aria-pressed="true"],.sv-ctl .sq.fb.none[aria-pressed="true"]{background:#ffffff14;border-color:var(--stage-text);color:var(--stage-text)}
.sq:disabled,.btn:disabled{opacity:.4}

/* toasts / popovers */
#toasts{position:absolute;left:0;right:0;bottom:calc(16px + var(--sa-b));display:flex;justify-content:center;pointer-events:none;z-index:90}
.toast{pointer-events:auto;background:var(--ink);color:var(--paper);border-radius:12px;padding:4px 6px 4px 16px;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow);max-width:92%;min-height:48px;animation:tin .18s ease-out}
.toast button{min-height:var(--hit);padding:0 14px;border:0;background:transparent;color:var(--honey);font-weight:700;border-radius:8px}
@keyframes tin{from{transform:translateY(12px);opacity:0}}
#tip{position:absolute;z-index:120;max-width:min(280px,calc(100% - 16px));display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:8px;background:var(--tip-bg);color:var(--tip-fg);box-shadow:0 0 0 1px var(--tip-edge),var(--shadow);font-size:13px;line-height:1.3;font-weight:600}
#tip[hidden]{display:none}
#tip .kbd{min-width:22px;padding:0 5px;background:transparent;color:inherit;border-color:var(--tip-edge)}
#tip>i{position:absolute;width:10px;height:10px;background:inherit;transform:rotate(45deg)}
#tip[data-side="bottom"]>i{top:-5px;margin-left:-5px}#tip[data-side="top"]>i{bottom:-5px;margin-left:-5px}
#tip[data-side="right"]>i{left:-5px;margin-top:-5px}#tip[data-side="left"]>i{right:-5px;margin-top:-5px}
@media (prefers-reduced-motion:no-preference){#tip{animation:tipin .12s ease-out}}
@keyframes tipin{from{opacity:0}}
[data-tip]{-webkit-touch-callout:none}
#safe{position:absolute;visibility:hidden;pointer-events:none;padding:var(--sa-t) var(--sa-r) var(--sa-b) var(--sa-l)}
.pop{position:absolute;z-index:95;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:12px 14px;width:min(360px,calc(100% - 20px))}
.pal{display:grid;grid-template-columns:repeat(5,var(--hit));gap:4px;width:auto}
.pal button{width:var(--hit);height:var(--hit);border-radius:50%;border:0;background:transparent;display:flex;align-items:center;justify-content:center}
.pal button[aria-pressed="true"]{box-shadow:inset 0 0 0 3px var(--honey)}
.pal .dotx{width:28px;height:28px;border-radius:50%;border:2px solid rgba(127,127,127,.55)}
.pal .row2{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted)}

/* dialogs */
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:60;display:flex;align-items:center;justify-content:center;padding:calc(16px + var(--sa-t)) 16px calc(16px + var(--sa-b))}
.dlg{background:var(--card);border-radius:14px;box-shadow:var(--shadow);width:min(640px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden}
.dlg.wide{width:min(760px,100%)}
@container app (max-width:520px){
  .scrim{align-items:flex-end;padding:calc(24px + var(--sa-t)) 0 0}
  .dlg,.dlg.wide{width:100%;border-radius:16px 16px 0 0}
  .scrim .dlg-f{padding-bottom:calc(12px + var(--sa-b))}
}
.dlg-h{display:flex;align-items:center;padding:6px 8px 6px 20px;border-bottom:1px solid var(--border);gap:6px}
.dlg-h h2{margin:0;font-size:19px;flex:1}
.dlg-b{padding:14px 20px;overflow:auto;flex:1;min-height:0;-webkit-overflow-scrolling:touch}
.dlg-f{display:flex;gap:8px;justify-content:flex-end;padding:10px 16px calc(12px);border-top:1px solid var(--border);flex-wrap:wrap;align-items:center}
.plist{list-style:none;margin:0;padding:0;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.plist li{display:flex;align-items:center;gap:12px;min-height:52px;padding:0 12px;border-bottom:1px solid var(--border);cursor:pointer}
.plist li:last-child{border-bottom:0}
.plist li[aria-selected="true"]{background:var(--honey-soft);box-shadow:inset 4px 0 0 var(--honey)}

.sv-ctl .btn.primary{background:var(--honey);border-color:var(--honey);color:var(--on-honey)}
.sv-title{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.sv-title span{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#svSync{margin-right:auto;font-size:13px;color:var(--honey)}
#serie:not([hidden]) ~ #toasts{bottom:calc(80px + var(--sa-b))}
.sv-img.dragging{transition:none}
.sv-nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:64px;color:var(--stage-text);background:#00000066;transition:opacity .3s}
.sv-nav.prev{left:calc(4px + var(--sa-l))}.sv-nav.next{right:calc(4px + var(--sa-r))}
#serie.idle .sv-ctl,#serie.idle .sv-nav{opacity:0;pointer-events:none}
/* landscape: the photo fills the screen, Pick and Reject float at its side edges, the rest hides when idle (docs/plan.md Loupe layout) */
@container app (orientation:landscape){
  #loupe,#serie{--rail:96px;--railL:calc(var(--rail) + var(--sa-l));--railR:calc(var(--rail) + var(--sa-r))}
  #loupe .l-top{position:absolute;top:0;left:0;right:0;z-index:4;padding-left:calc(var(--railL) + 6px)}
  #loupe #infoPanel{padding-top:68px;margin-right:var(--railR)}
  #loupe .l-top,#loupe .film{transition:opacity .3s}
  #loupe .film{position:absolute;left:var(--railL);right:var(--railR);bottom:56px;z-index:4;background:#0009}
  #loupe .l-ctrl,#serie .sv-bot{position:absolute;inset:0;z-index:4;padding:0;background:none;border:0;pointer-events:none}
  #loupe .ab-small,#serie .ab-small{position:absolute;left:var(--railL);right:var(--railR);bottom:0;min-height:56px;padding:6px 8px calc(6px + var(--sa-b));background:linear-gradient(transparent,#000c);pointer-events:auto;transition:opacity .3s}
  #serie .sv-bar{flex:none;max-width:none;margin:0}
  #serie #svSync{position:absolute;left:var(--railL);bottom:62px;padding:0 10px}
  #loupe .ab-big,#serie .ab-big{position:absolute;inset:0;max-width:none;width:auto}
  #loupe.noflags,#serie.noflags{--railL:var(--sa-l);--railR:var(--sa-r)}
  .ab-big .grp.flags{flex:1;display:grid;grid-template-columns:var(--railL) 1fr var(--railR);grid-template-rows:1fr auto auto 1fr;gap:10px 0;padding:8px 0 calc(8px + var(--sa-b))}
  .ab-big .bigbtn{pointer-events:auto;flex-direction:column;gap:6px;width:calc(var(--rail) - 12px);height:clamp(120px,36cqh,240px);min-height:0;padding:0 4px;margin:0 6px;font-size:14px}
  .ab-big .bigbtn.pick{grid-area:2/1;justify-self:end}
  .ab-big .bigbtn.reject{grid-area:2/3;justify-self:start}
  .ab-big .bigbtn.none{grid-area:3/3;justify-self:start;height:56px;flex:none}
  .ab-big .bigbtn.none span{display:none}
  .ab-big .bigbtn:not([aria-pressed="true"]){background:#000000a6;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
  #loupe .navbtn{transition:opacity .3s}
  #loupe .navbtn.l{left:calc(var(--railL) + 4px)}#loupe .navbtn.r{right:calc(var(--railR) + 4px)}
  #loupe.idle .l-top,#loupe.idle .film,#loupe.idle .ab-small,#loupe.idle .navbtn,#serie.idle .ab-small,#serie.idle #svSync{opacity:0;pointer-events:none}
  #serie.idle .sv-bot{opacity:1}
  #serie .sv-top{padding-left:calc(var(--railL) + 10px)}
  #serie .sv-nav.prev{left:calc(var(--railL) + 4px)}#serie .sv-nav.next{right:calc(var(--railR) + 4px)}
  #serie:not([hidden]) ~ #toasts{bottom:calc(64px + var(--sa-b))}
}
@container app (orientation:landscape) and (max-height:520px){
  #loupe,#serie{--rail:80px}
  .ab-big .bigbtn{font-size:13px}
}
/* fine pointer (mouse, trackpad): compact sizes like Nextcloud's own UI (docs/plan.md Control sizes) */
#frame[data-input="fine"]{--hit:34px;--ic:18px;font-size:14px}
#frame[data-input="fine"] .hdr{height:calc(50px + var(--sa-t))}
#frame[data-input="fine"] .bar{height:44px}
#frame[data-input="fine"] .logo{font-size:17px}
#frame[data-input="fine"] .logo svg{width:26px;height:26px}
#frame[data-input="fine"] nav a.rc{min-height:40px}
#frame[data-input="fine"] .plist li{min-height:40px}
#frame[data-input="fine"] .setrow{min-height:40px}
#frame[data-input="fine"] .toast{min-height:42px}
#frame[data-input="fine"] .sw-btn{width:40px;height:24px}
#frame[data-input="fine"] .l-top{min-height:48px}
#frame[data-input="fine"] .l-top .btn{min-width:48px}
#frame[data-input="fine"] .navbtn{width:40px;height:40px;margin-top:-20px}
#frame[data-input="fine"] .sv-nav{width:36px;height:48px}
#frame[data-input="fine"] .bigbtn{min-height:40px;font-size:15px;border-radius:10px}
@container app (orientation:landscape){
  #frame[data-input="fine"] :is(#loupe,#serie){--rail:64px}
  #frame[data-input="fine"] .ab-big .bigbtn{height:clamp(88px,20cqh,140px);font-size:13px}
  #frame[data-input="fine"] .ab-big .bigbtn.none{height:40px}
  #frame[data-input="fine"] :is(#loupe,#serie) .ab-small{min-height:44px}
  #frame[data-input="fine"] #loupe .film{bottom:44px}
}

const TPL_TOKENS = {date:'fmt', name:'case', ext:'case', camera:'case', make:'case', number:'digits'};

/* one key map for every screen: c supplies ids, and step, advance, flag, zoom or pickRest where the screen has them */
function cullKey(e, k, c){
  const lk = k.toLowerCase(), mod = e.ctrlKey || e.metaKey;
  if (mod){

    if (lk === 'y'){ e.preventDefault(); redo(); return true; } return false;
  }

  if ((k === 'ArrowLeft' || k === 'ArrowRight') && c.step){ e.preventDefault(); c.step(k === 'ArrowLeft' ? -1 : 1); return true; }
  if ((k === 'Home' || k === 'End') && c.step){ e.preventDefault(); c.step(k === 'Home' ? -1e6 : 1e6); return true; }
  if (isKey(k, 'zoom') && c.zoom){ e.preventDefault(); c.zoom(); return true; }
  if (e.shiftKey && lk === 'k' && c.pickRest){ e.preventDefault(); c.pickRest(); return true; }
  if (!ids.length) return false;
  const n = /^[0-5]$/.test(k) ? +k : e.shiftKey && /^Digit[0-5]$/.test(e.code) ? +e.code[5] : -1;
  if (n >= 0){ e.preventDefault(); change(ids, 'rating', n); if (adv && c.advance) c.advance(); return true; }
  if (k === HOTKEY.starDown || k === HOTKEY.starUp){ e.preventDefault(); const it = S.byId.get(ids[0]); change(ids, 'rating', clamp((it ? it.rating : 0) + (k === HOTKEY.starUp ? 1 : -1), 0, 5)); return true; }
  const f = FLAGS.find(fl => lk === fl.key.toLowerCase()); if (f){ e.preventDefault(); flag(f.v); return true; }
  if (k === HOTKEY.togglePick){ e.preventDefault(); flag('pick'); return true; }
  const lab = LABELS.find(l => l.key === k); if (lab){ e.preventDefault(); toggleLabel(ids, lab.id); return true; }
  if (isKey(k, 'keepRaw')){ e.preventDefault(); toggleKeepRaw(ids); return true; }
  return false;
}
/* vi keys: the key each stands for on this screen; '' while a first g waits for the second */
function viKey(e){
  const lk = e.key.toLowerCase(), g = S.viG, grid = !S.loupe && !S.serie && !S.dlg; S.viG = false;
  if (lk === 'g') return e.shiftKey ? HOTKEY.last : g ? HOTKEY.first : (S.viG = true, '');

}

function bindDivider(el, {get, set, min, max, sign}){
  let x0 = 0, w0 = 0;
  const move = e => { set(clamp(w0 + sign * (e.clientX - x0) / (S.scale || 1), min, max), true); };
  el.addEventListener('pointerdown', e => { x0 = e.clientX; w0 = get(); el.setPointerCapture(e.pointerId); el.classList.add('drag'); el.addEventListener('pointermove', move); e.preventDefault(); });
  const end = () => { el.classList.remove('drag'); el.removeEventListener('pointermove', move); savePrefs(); if (S.loupe){ measure(); showLoupe(); } };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);

}
