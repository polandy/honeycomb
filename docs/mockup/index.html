<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>honeycomb mockup</title>
<link rel="icon" href="data:,">
<style>
:root{
  --ink:#17150F; --paper:#FBF8F1; --honey:#F4A51C; --on-honey:#17150F; --honey-hover:#e29610;
  --bg:#FBF8F1; --bg-nav:#ffffff; --card:#ffffff; --card-2:#f5f1e6; --text:#1c1a14; --muted:#6a6455;
  --border:#e4ddca; --honey-soft:#fdecc8; --honey-text:#8a5600; --danger:#c62f2b; --danger-soft:#fde4e2;
  --ok:#1f8a4c; --ok-soft:#dff3e6; --warn-bg:#ffe3dc; --warn-text:#a52f14; --focus:#1a62d6; --scrim:rgba(20,16,8,.5);
  --shadow:0 4px 18px rgba(30,20,0,.14); --q:#9a5c00; --tile-bg:#e9e3d2;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#14130f; --bg-nav:#1b1a15; --card:#211f19; --card-2:#2a271f; --text:#f3efe4; --muted:#a8a190;
    --border:#38342a; --honey-soft:#3d2e0e; --honey-text:#f7b94a; --danger:#ef6b66; --danger-soft:#43201e;
    --ok:#5fcf8a; --ok-soft:#1c3a28; --warn-bg:#4a2018; --warn-text:#ffb4a2; --focus:#8ab4ff; --scrim:rgba(0,0,0,.65);
    --shadow:0 4px 22px rgba(0,0,0,.5); --q:#f7b94a; --tile-bg:#2a271f; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14130f; --bg-nav:#1b1a15; --card:#211f19; --card-2:#2a271f; --text:#f3efe4; --muted:#a8a190;
  --border:#38342a; --honey-soft:#3d2e0e; --honey-text:#f7b94a; --danger:#ef6b66; --danger-soft:#43201e;
  --ok:#5fcf8a; --ok-soft:#1c3a28; --warn-bg:#4a2018; --warn-text:#ffb4a2; --focus:#8ab4ff; --scrim:rgba(0,0,0,.65);
  --shadow:0 4px 22px rgba(0,0,0,.5); --q:#f7b94a; --tile-bg:#2a271f; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Helvetica Neue",Arial,sans-serif;overscroll-behavior:none}
body{overflow:hidden;-webkit-text-size-adjust:100%}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
svg.ic.fill{fill:currentColor}
svg.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

#host{height:100vh;height:100dvh;display:flex;align-items:center;justify-content:center;overflow:hidden}
#host.framed{background:repeating-linear-gradient(45deg,#2a2a2a 0 10px,#252525 10px 20px)}
#frame{position:relative;width:100vw;height:100vh;height:100dvh;overflow:hidden;background:var(--bg);container:app/size;flex:none;
  display:flex;flex-direction:column}
#host.framed #frame{border-radius:22px;box-shadow:0 0 0 10px #000,0 20px 60px rgba(0,0,0,.6)}

/* header */
.hdr{flex:none;background:var(--ink);color:var(--paper);display:flex;align-items:center;gap:4px;
  height:calc(52px + env(safe-area-inset-top));padding:env(safe-area-inset-top) calc(204px + env(safe-area-inset-right)) 0 calc(6px + env(safe-area-inset-left));z-index:30}
.hdr .icon-btn{color:var(--paper)}
.hdr .icon-btn:disabled{opacity:.35}
.logo{display:flex;align-items:center;gap:8px;font-weight:600;font-size:19px;letter-spacing:.2px;padding:0 8px}
.logo svg{width:32px;height:32px}
.hdr .sp{flex:1}
.hdr .q{color:var(--honey);border-color:var(--honey)}

.icon-btn{width:44px;height:44px;border-radius:10px;border:0;background:transparent;display:inline-flex;align-items:center;justify-content:center;position:relative}
.icon-btn:active{background:rgba(127,127,127,.22)}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--border);background:var(--card);display:inline-flex;align-items:center;gap:8px;
  justify-content:center;font-weight:500;white-space:nowrap;position:relative}
.btn:active{filter:brightness(.93)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--honey);border-color:var(--honey);color:var(--on-honey);font-weight:600}
.btn.primary:active{background:var(--honey-hover)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff;font-weight:600}
.btn.ghost{background:transparent}
.btn[aria-pressed="true"]{background:var(--honey-soft);border-color:var(--honey);color:var(--text)}
.badge-n{min-width:20px;height:20px;border-radius:10px;background:var(--honey);color:var(--on-honey);font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;padding:0 5px}

/* question markers */
.q{position:relative;display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:24px;padding:0 8px;border-radius:12px;border:1.5px dashed var(--q);
  color:var(--q);background:transparent;font-size:11px;font-weight:700;letter-spacing:.3px;flex:none;margin:0 2px}
.q::after{content:"";position:absolute;inset:-10px}
body.noq .q{display:none}

/* layout */
.body{flex:1;display:flex;min-height:0;position:relative}
nav#nav{width:var(--navw,248px);flex:none;background:var(--bg-nav);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:8px 8px calc(8px + env(safe-area-inset-bottom)) calc(8px + env(safe-area-inset-left));
  transition:margin-left .2s,transform .2s;z-index:20}
#frame[data-nav="closed"] nav#nav{margin-left:calc(-1px - var(--navw,248px))}
#frame[data-nav="closed"] #navDiv{display:none}
nav a{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:10px;color:inherit;text-decoration:none;border:0;background:none;width:100%;text-align:left}
nav a.active{background:var(--honey-soft);font-weight:600}
nav .sp{flex:1}
nav .sect{font-size:12px;color:var(--muted);padding:14px 12px 4px;text-transform:uppercase;letter-spacing:.6px}
#navScrim{display:none}
@container app (max-width:999px){
  nav#nav{position:absolute;left:0;top:0;bottom:0;box-shadow:var(--shadow);margin-left:0!important;transform:translateX(0)}
  #frame[data-nav="closed"] nav#nav{transform:translateX(-110%);box-shadow:none}
  #frame[data-nav="open"] #navScrim{display:block;position:absolute;inset:0;background:var(--scrim);z-index:19}
}
main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.toolbar{flex:none;padding:10px 12px 6px calc(12px + env(safe-area-inset-left));display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.crumbs{display:flex;align-items:center;flex-wrap:wrap;gap:0;flex:1;min-width:0}
.crumbs button{min-height:44px;padding:0 8px;border:0;background:none;border-radius:8px;font-size:16px;white-space:nowrap}
.crumbs button:last-of-type{font-weight:700}
.crumbs .sep{color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{min-width:44px;min-height:44px;border:0;background:transparent;padding:0 12px;border-right:1px solid var(--border)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"],.seg button[aria-checked="true"]{background:var(--honey);color:var(--on-honey);font-weight:700}
.sel-input{min-height:44px;border-radius:10px;border:1px solid var(--border);background:var(--card);padding:0 10px}
.grow{flex:1}
.selrow{background:var(--honey-soft);border:1px solid var(--honey);border-radius:12px;padding:4px 8px 4px 14px}
.selrow b{margin-right:auto}

/* filter bar */
.filters{flex:none;margin:0 12px 6px calc(12px + env(safe-area-inset-left));background:var(--card);border:1px solid var(--border);border-radius:12px;padding:8px 12px;display:flex;flex-wrap:wrap;gap:6px 18px;align-items:flex-start}
.fgroup{display:flex;flex-direction:column;gap:2px}
.fgroup>.lbl{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.fgroup>.chips{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.chip{min-height:44px;min-width:44px;padding:0 12px;border-radius:22px;border:1px solid var(--border);background:var(--card-2);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--honey);border-color:var(--honey);color:var(--on-honey);font-weight:700}
.chip.sw{padding:0;width:44px;border-radius:50%;background:transparent;border-color:transparent}
.chip.sw .dotx{width:26px;height:26px;border-radius:50%;border:2px solid rgba(127,127,127,.5)}
.chip.sw[aria-pressed="true"]{background:transparent;box-shadow:0 0 0 3px var(--honey) inset}
.fright{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;align-self:flex-end}
.count{font-weight:700;font-variant-numeric:tabular-nums}
.dotc{display:inline-block;width:12px;height:12px;border-radius:50%;border:1.5px solid rgba(255,255,255,.85);box-shadow:0 0 0 1px rgba(0,0,0,.35)}

/* resizable areas */
.divider{flex:none;width:10px;margin:0 -5px;cursor:col-resize;touch-action:none;position:relative;z-index:21;background:transparent}
.divider::after{content:"";position:absolute;left:4px;top:0;bottom:0;width:2px;background:var(--border)}
.divider:hover::after,.divider.drag::after,.divider:focus-visible::after{background:var(--honey);width:4px;left:3px}
.divider:focus-visible{outline:none}
@container app (max-width:999px){#navDiv{display:none}}
.tsr{display:inline-flex;align-items:center;gap:6px}
.tsr input[type=range]{width:140px;min-height:44px;accent-color:var(--honey);touch-action:none}
.tsr svg.ic{width:16px;height:16px}
#loupe .l-main{flex:1;display:flex;min-height:0}
#loupe .l-main #stage{flex:1;min-width:0}
#infoPanel{flex:none;width:var(--infow,300px);background:#151310;border-left:1px solid #ffffff1a;overflow:auto;padding:12px 14px;font-size:14px}
#infoPanel h4{margin:0 0 8px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
#infoPanel dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px}
#infoPanel dt{color:var(--muted)}#infoPanel dd{margin:0;overflow-wrap:anywhere}
#loupe .l-main .divider::after{background:#ffffff2a}
#loupe.immersive .l-top,#loupe.immersive .film,#loupe.immersive .l-ctrl,#loupe.immersive #infoPanel,#loupe.immersive #infoDiv,#loupe.immersive .navbtn{display:none}
#loupe.immersive #stage{cursor:none}
/* grid */
.grid-wrap{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:4px 12px 16px calc(12px + env(safe-area-inset-left));min-height:0;position:relative}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--ts,160px),1fr));gap:8px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.tile{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--tile-bg);contain:layout paint style;content-visibility:auto;contain-intrinsic-size:auto 160px;cursor:pointer;outline-offset:-3px}
.tile img.th{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;-webkit-user-drag:none;opacity:0;transition:opacity .2s}
.tile img.th.ld{opacity:1}
.tile .pair{position:absolute;left:6px;top:6px;font-size:11px;font-weight:700;border-radius:6px;padding:2px 6px;line-height:1.3}
.pair.p{background:var(--honey);color:var(--on-honey)}
.pair.s{background:var(--warn-bg);color:var(--warn-text);border:1px dashed var(--warn-text)}
.tile .ov{position:absolute;left:0;right:0;bottom:0;padding:16px 6px 5px;background:linear-gradient(transparent,rgba(0,0,0,.7));display:flex;align-items:center;gap:6px;color:#fff;font-size:12px}
.tile .stars{letter-spacing:-1px;font-size:12px;white-space:nowrap}
.stars .on{color:#ffc93c}.stars .off{color:rgba(255,255,255,.35)}
.tile .fl{margin-left:auto;width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center}
.tile .fl svg{width:20px;height:20px;stroke-width:2.2}.fl.pick{color:#fff}.fl.reject{color:#ff8f87}
.tile.rej img.th{opacity:.35}.tile.rej .rejx{display:flex}
.rejx{display:none;position:absolute;inset:0;align-items:center;justify-content:center;color:#fff;filter:drop-shadow(0 1px 6px rgba(0,0,0,.6));pointer-events:none}
.rejx svg{width:48px;height:48px;stroke-width:1.5}
.tile .chk{position:absolute;right:6px;top:6px;width:26px;height:26px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.25);display:none;align-items:center;justify-content:center;color:var(--on-honey)}
.tile .chk svg{width:16px;height:16px;stroke-width:3;opacity:0}
.selmode .tile .chk{display:flex}
.tile.sel{box-shadow:inset 0 0 0 4px var(--honey)}
.tile.sel .chk{background:var(--honey);border-color:var(--honey)}.tile.sel .chk svg{opacity:1}
.tile:focus-visible{outline:3px solid var(--focus)}
.empty{padding:60px 20px;text-align:center;color:var(--muted)}
.empty .big{font-size:18px;color:var(--text);font-weight:600;margin-bottom:6px}

/* action bar */
.actionbar{flex:none;background:var(--card);border-top:1px solid var(--border);padding:8px 12px calc(8px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;box-shadow:0 -4px 14px rgba(0,0,0,.08)}
.actionbar .grp{display:flex;align-items:center;gap:4px}
.actionbar .gl{font-size:12px;color:var(--muted);margin-right:2px}
.sq{min-width:44px;height:44px;border-radius:10px;border:1px solid var(--border);background:var(--card-2);padding:0 8px;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.sq[aria-pressed="true"]{background:var(--honey);border-color:var(--honey);color:var(--on-honey)}
.sq:disabled,.btn:disabled{opacity:.4}

/* toasts / popovers */
#toasts{position:absolute;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom));display:flex;justify-content:center;pointer-events:none;z-index:90}
.toast{pointer-events:auto;background:var(--ink);color:var(--paper);border-radius:12px;padding:4px 6px 4px 16px;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow);max-width:92%;min-height:48px;animation:tin .18s ease-out}
.toast button{min-height:44px;padding:0 14px;border:0;background:transparent;color:var(--honey);font-weight:700;border-radius:8px}
@keyframes tin{from{transform:translateY(12px);opacity:0}}
.pop{position:absolute;z-index:95;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:12px 14px;width:min(360px,calc(100% - 20px))}
.pop h4{margin:0 0 6px;font-size:15px}
.pop ol{margin:6px 0;padding-left:20px}.pop li{margin:3px 0}
.pop .rec{background:var(--honey-soft);border-radius:8px;padding:6px 10px;margin-top:8px;font-size:14px}
.pop .tag{font-size:11px;font-weight:700;color:var(--q);letter-spacing:.4px}
.pal{display:grid;grid-template-columns:repeat(5,44px);gap:4px;width:auto}
.pal button{width:44px;height:44px;border-radius:50%;border:0;background:transparent;display:flex;align-items:center;justify-content:center}
.pal button[aria-pressed="true"]{box-shadow:inset 0 0 0 3px var(--honey)}
.pal .dotx{width:28px;height:28px;border-radius:50%;border:2px solid rgba(127,127,127,.55)}
.pal .row2{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted)}

/* dialogs */
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:60;display:flex;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom))}
.dlg{background:var(--card);border-radius:14px;box-shadow:var(--shadow);width:min(640px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden}
.dlg.wide{width:min(760px,100%)}
.dlg-h{display:flex;align-items:center;padding:6px 8px 6px 20px;border-bottom:1px solid var(--border);gap:6px}
.dlg-h h2{margin:0;font-size:19px;flex:1}
.dlg-b{padding:14px 20px;overflow:auto;flex:1;min-height:0;-webkit-overflow-scrolling:touch}
.dlg-f{display:flex;gap:8px;justify-content:flex-end;padding:10px 16px calc(12px);border-top:1px solid var(--border);flex-wrap:wrap;align-items:center}
.plist{list-style:none;margin:0;padding:0;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.plist li{display:flex;align-items:center;gap:12px;min-height:52px;padding:0 12px;border-bottom:1px solid var(--border);cursor:pointer}
.plist li:last-child{border-bottom:0}
.plist li[aria-selected="true"]{background:var(--honey-soft);box-shadow:inset 4px 0 0 var(--honey)}
.plist li .meta{font-size:12px;color:var(--muted)}
.plist li.dis{color:var(--muted)}
.plist .nm{flex:1;min-width:0}
.plist .go{width:44px;height:44px;margin-right:-8px;border:0;background:none;display:flex;align-items:center;justify-content:center;border-radius:10px}
.tgt{display:inline-flex;align-items:center;gap:8px;min-height:44px;border-radius:22px;background:var(--card-2);border:1px solid var(--border);padding:0 14px;font-weight:600;color:var(--text)}
.tgt[aria-pressed="true"]{background:var(--honey);color:var(--on-honey);border-color:var(--honey)}
.tgt small{font-weight:400;opacity:.75}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;word-break:break-all}
.inp.tpl{width:100%;font:13px ui-monospace,Menlo,Consolas,monospace;margin:10px 0 8px}
.tpl-err{white-space:pre;overflow:auto;font:13px ui-monospace,Menlo,Consolas,monospace;color:var(--warn-text);background:var(--warn-bg);border-radius:10px;padding:8px 10px;margin:0}
.pv{border:1px solid var(--border);border-radius:10px;font-size:13px}
.pv>div{padding:6px 10px;border-bottom:1px solid var(--border)}.pv>div:last-child{border:0}
.tagn{display:inline-block;font-size:11px;border-radius:6px;padding:0 6px;margin-left:6px;background:var(--honey-soft);color:var(--honey-text)}
.tagn.warn{background:var(--warn-bg);color:var(--warn-text)}
.fl-list .conf{background:var(--warn-bg);flex-wrap:wrap;align-items:center}
.fl-list .conf .seg button{min-height:36px}
.fl-list{max-height:min(280px,34vh);overflow:auto;border:1px solid var(--border);border-radius:10px;font-size:13px;font-variant-numeric:tabular-nums}
.fl-list div{display:flex;gap:8px;padding:5px 10px;border-bottom:1px solid var(--border)}
.fl-list div:last-child{border:0}
.fl-list .n{flex:1;min-width:0;word-break:break-all}.fl-list .n i{font-style:normal;color:var(--muted)}
.fl-list .k{color:var(--muted);width:42px}
.fl-list .bad{color:var(--danger);font-size:12px}
.sumrow{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 12px}
.stat{background:var(--card-2);border-radius:10px;padding:8px 14px;min-width:100px}.stat b{display:block;font-size:20px}
.note{display:flex;gap:8px;align-items:center;background:var(--ok-soft);border-radius:10px;padding:10px 12px;margin:12px 0 0}
.sec{border:1px solid var(--border);border-radius:12px;padding:6px 14px 12px;margin:0 0 14px}
.sec h3{font-size:14px;margin:10px 0 6px;display:flex;align-items:center;gap:6px}
.sec .hint{font-size:13px;color:var(--muted);margin:0 0 8px}
.setrow{display:flex;align-items:center;gap:12px;min-height:48px;justify-content:space-between;flex-wrap:wrap}
.sw-btn{width:52px;height:32px;border-radius:16px;border:0;background:var(--border);position:relative;flex:none;padding:0}
.sw-btn::before{content:"";position:absolute;left:4px;top:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.sw-btn::after{content:"";position:absolute;inset:-6px -2px}
.sw-btn[aria-checked="true"]{background:var(--honey)}.sw-btn[aria-checked="true"]::before{transform:translateX(20px)}
.chiprow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ext{display:inline-flex;align-items:center;min-height:44px;border-radius:22px;background:var(--card-2);border:1px solid var(--border);padding-left:14px;font-weight:600}
.ext button{width:44px;height:44px;border:0;background:none;border-radius:50%;font-size:14px}
.inp{min-height:44px;border-radius:10px;border:1px solid var(--border);background:var(--card);padding:0 12px;width:110px}
.kbd{display:inline-block;min-width:26px;text-align:center;padding:1px 7px;border:1px solid var(--border);border-bottom-width:2px;border-radius:6px;background:var(--card-2);font:600 12px ui-monospace,Menlo,Consolas,monospace}

/* ---------- data generation ---------- */
function genFolder(path){
  const cfg = FOLDERS[path], r = rng(cfg.seed), items = [];
  let n = 100 + Math.floor(r() * 300), t = Date.parse(cfg.date + 'T08:00:00Z');
  const base = path + '/';
  for (let i = 0; i < cfg.count; i++){
    n += 1 + Math.floor(r() * 3); const gap = r(); t += (gap < .22 ? .3 + gap * 12 : 20 + (gap - .22) * 1150) * 1000;
    let x = r(), cam = cfg.cams[0];
    for (const c of cfg.cams){ if (x < c[2]){ cam = c; break; } x -= c[2]; }
    const st = cam[1] + String(n).padStart(4, '0'), roll = r();
    const type = roll < cfg.pPair ? 'pair' : roll < cfg.pPair + cfg.pJpg ? 'jpg' : 'raw';
    const portrait = r() < cfg.pPortrait, ratio = cfg.phone ? 4/3 : 3/2;
    const it = {id:path + '#' + i, base:st, jpg:null, raw:null, xmp:null, aw:portrait ? 1 : ratio, ah:portrait ? ratio : 1, nativeW:portrait ? 4000 : 6000,
      seed:Math.floor(r() * 1e9), hue:Math.floor(r() * 360), kind:cfg.kinds[Math.floor(r() * cfg.kinds.length)], time:t, rating:0, label:null, flag:'none'};
    const jdir = cfg.mode === 'sub' ? base + 'JPG/' : base, rdir = cfg.mode === 'sub' ? base + 'RAW/' : base;
    if (type !== 'raw') it.jpg = {name:st + '.JPG', dir:jdir, size:+(6 + r() * 8).toFixed(1)};
    if (type !== 'jpg') it.raw = {name:st + '.' + cam[0], dir:rdir, size:+(20 + r() * 40).toFixed(1)};
    if (it.raw && r() < .15) it.xmp = {name:it.raw.name + '.xmp', dir:rdir, size:.01};
    else if (!it.raw && r() < .06) it.xmp = {name:it.jpg.name + '.xmp', dir:jdir, size:.01};
    if (r() < .35) it.rating = 1 + Math.floor(r() * 5);
    if (r() < .14) it.label = LABELS[Math.floor(r() * LABELS.length)].id;
    const f = r(); it.flag = f < .12 ? 'pick' : f < .22 ? 'reject' : 'none';
    const noExif = type === 'jpg' && i % 7 === 3;
    it.model = noExif ? null : MODELS[cam[0]]; it.make = noExif ? null : MAKES[cam[0]]; it.exifTime = noExif ? null : t; it.mtime = t + 3725000;
    items.push(it);

}

    for (let i = 0; i < 26; i++){ const y = hy + (H - hy) * (i / 26) ** 1.4, w = (W * .14) * (1 - i / 34) * (.4 + r()); c.fillStyle = `rgba(255,225,160,${.5 - i / 60})`; c.fillRect(sx - w / 2 + (r() - .5) * 8, y, w, Math.max(1.5, H * .006)); }

    for (let row = 0; row < 5; row++){
      const by = H * (.5 + .1 * row), th = H * (.18 + .07 * row), tw = th * .45, n = 6 + row * 2;
      for (let k = 0; k < n; k++){ const x = W * (k + r() * .8) / n; c.fillStyle = hsl(hue + 90, 35 + 5 * row, 46 - row * 8); c.beginPath(); c.moveTo(x - tw / 2, by); c.lineTo(x, by - th * (.8 + .4 * r())); c.lineTo(x + tw / 2, by); c.fill(); }
      c.fillStyle = hsl(hue + 90, 35 + 5 * row, 46 - row * 8); c.fillRect(0, by - 2, W, H - by + 2);
    }
  } else {
    g.addColorStop(0, hsl(hue, 40, 18)); g.addColorStop(1, hsl(hue + 40, 55, 36)); c.fillStyle = g; c.fillRect(0, 0, W, H);
    for (let i = 0; i < 34; i++){ const x = W * r(), y = H * r(), rad = H * (.03 + .09 * r()); const rg = c.createRadialGradient(x, y, 0, x, y, rad); rg.addColorStop(0, hsl(hue + 60 * r(), 90, 75, .55)); rg.addColorStop(1, hsl(hue, 90, 70, 0)); c.fillStyle = rg; c.beginPath(); c.arc(x, y, rad, 0, 7); c.fill(); }

}
const thumbs = new Map();
function thumbURL(it){

/* ---------- brand mark ---------- */
function logoSVG(){
  const cx = 24, cy = 24, R = 21, V = [];
  for (let k = 0; k < 6; k++){ const a = (-90 + 60 * k) * Math.PI / 180; V.push([cx + R * Math.cos(a), cy + R * Math.sin(a)]); }
  let d = '';
  for (let k = 0; k < 6; k++){
    const p = V[k], a = V[(k + 5) % 6], b = V[(k + 1) % 6], f = .34, m = q => [p[0] + (q[0] - p[0]) * f, p[1] + (q[1] - p[1]) * f];
    const m1 = m(a), m2 = m(b); d += `M${m1[0].toFixed(1)} ${m1[1].toFixed(1)}L${p[0].toFixed(1)} ${p[1].toFixed(1)}L${m2[0].toFixed(1)} ${m2[1].toFixed(1)}`;
  }
  const hex = (x, y, r) => { let s = ''; for (let k = 0; k < 6; k++){ const a = (-90 + 60 * k) * Math.PI / 180; s += (k ? 'L' : 'M') + (x + r * Math.cos(a)).toFixed(1) + ' ' + (y + r * Math.sin(a)).toFixed(1); } return s + 'Z'; };
  return `<svg viewBox="0 0 48 48" role="img" aria-label="honeycomb"><path d="${d}" fill="none" stroke="#FBF8F1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="${hex(17.4, 24, 6.2)}" fill="#F4A51C"/><path d="${hex(30.6, 24, 6.2)}" fill="none" stroke="#FBF8F1" stroke-width="2.2" stroke-linejoin="round"/></svg>`;
}

function passes(it){
  const f = S.filters;

  if (!f.flags.size && ((f.scope === 'notrej' && it.flag === 'reject') || (f.scope === 'undecided' && it.flag !== 'none'))) return false;
  if (f.rating !== null && (f.ratingOp === 'gte' ? it.rating < f.rating : it.rating !== f.rating)) return false;

/* ---------- series (bursts) ---------- */
const BURST_GAP_MS = 3000, BURST_MAX = 4;
function burstGroups(){

  flush(); return out;
}

}
const cmpCache = new Map();
function cmpURL(it){ let u = cmpCache.get(it.id); if (!u){ u = getBig(it).toDataURL('image/jpeg', .8); cmpCache.set(it.id, u); } return u; }

/* ---------- mutations / undo ---------- */
const FLAG_TXT = {pick:'Picked', reject:'Rejected', none:'Unflagged'};
function change(ids, key, value, opts = {}){
  const changes = [];
  for (const id of ids){ const it = S.byId.get(id); if (it && it[key] !== value){ changes.push({id, key, from:it[key], to:value}); it[key] = value; } }
  if (!changes.length) return false;
  const one = ids.length === 1 ? stem(S.byId.get(ids[0])) : ids.length + ' items';
  let desc;
  if (key === 'flag') desc = `${FLAG_TXT[value]} ${one}`;
  else if (key === 'rating') desc = value ? `Rated ${one} ${'★'.repeat(value)}` : `Cleared rating of ${one}`;
  else desc = value ? `Label ${value} on ${one}` : `Removed label from ${one}`;
  const adv = key === 'flag' && value !== 'none' && ids.length === 1 && !S.loupe && S.settings.autoAdvance ? nextUndecided(ids[0]) : null;
  pushUndo(desc, changes);
  toast(key === 'flag' && value === 'reject' ? (ids.length > 1 ? `Rejected ${ids.length} photos` : 'Rejected') : desc, true);

  mockTheme(el){ S.mock.theme = el.dataset.v; applyTheme(); renderMock(); },
  mockFrame(el){ S.mock.frame = el.dataset.v; renderMock(); layoutFrame(); },
  mockReset(){ const m = S.mock; closeDlg(); closeSerie(); if (S.loupe) closeLoupe(); S = freshState(); S.mock = {...S.mock, ...{theme:m.theme, frame:m.frame, open:true, showQ:m.showQ, fail:false}}; document.body.classList.toggle('noq', !S.mock.showQ); thumbs.clear(); bigCache.clear(); boot(); }
};
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  const inPop = e.target.closest('.pop'), act = t && t.dataset.act;
  if (!inPop && act !== 'q' && act !== 'palette' && act !== 'more' && act !== 'path') closePop();
  if (e.target.dataset && e.target.dataset.scrim && S.dlg && S.folderPath) closeDlg();
  if (!t) return; if (t.tagName === 'A') e.preventDefault();
  if (act === 'q' && inPop){ closePop(); return; }
  A[t.dataset.act] && A[t.dataset.act](t, e);
  if (inPop && inPop.classList.contains('menu') && act && act !== 'mq' && inPop.isConnected) closePop();
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('li[data-act]')){ e.preventDefault(); e.target.click(); }
});
document.addEventListener('input', e => {
  const k = e.target.dataset && e.target.dataset.chg;
  if (k === 'tsize') setTileSize(+e.target.value, true);
  else if (k === 'tpl'){ const v = e.target.value; S.tplDraft = v; if (!parseTpl(v).err) S.settings.moveTemplate = v; $('tplPv').innerHTML = tplPreview(v); }
});
document.addEventListener('change', e => {
  const k = e.target.dataset && e.target.dataset.chg; if (!k) return;
  if (k === 'sort'){ S.sort = e.target.value; refreshView(); }
  else if (k === 'tsize') setTileSize(+e.target.value);
  else if (k === 'swipeUp' || k === 'swipeDown'){ S.settings[k] = e.target.value; if (S.loupe) renderLoupeChrome(); }
  else if (k === 'rawFolder' || k === 'jpgFolder') S.settings[k] = e.target.value.trim() || (k === 'rawFolder' ? 'RAW' : 'JPG');
  else if (k === 'mockFail') S.mock.fail = e.target.checked;
  else if (k === 'mockConflict'){ S.mock.conflict = e.target.checked; if (S.dlg && S.dlg.type === 'move') renderDlg(); }
  else if (k === 'mockQ'){ S.mock.showQ = e.target.checked; document.body.classList.toggle('noq', !S.mock.showQ); closePop(); }
});
document.addEventListener('submit', e => {
  const f = e.target.closest('[data-form="ext"]'); if (!f) return; e.preventDefault();
  const v = f.elements.e.value.replace(/^\./, '').trim().toUpperCase(), a = S.settings[f.dataset.k];
  if (v && !a.includes(v)) a.push(v); S.dlg.refocus = `[data-form="ext"][data-k="${f.dataset.k}"] input`; renderDlg();
});
document.addEventListener('keydown', e => {
  const tg = e.target; if (tg.matches && tg.matches('input,select,textarea')) return;
  const mod = e.ctrlKey || e.metaKey, k = e.key;
  if (k === 'Escape'){
    if ($('popRoot').firstChild){ closeMenu(); return; }
    if (S.serie){ closeSerie(); return; }
    if (S.dlg){ if (S.folderPath || S.dlg.type !== 'picker') closeDlg(); return; }
    if (S.loupe){ if (L.immersive) setImmersive(false); else closeLoupe(); return; }
    if (S.selMode){ setSelMode(false); return; } return;
  }
  if (k === '?' ){ e.preventDefault(); S.dlg && S.dlg.type === 'keys' ? closeDlg() : openDlg({type:'keys'}); return; }
  if (S.serie){ serieKey(e); return; }
  if (S.dlg && S.dlg.type === 'burst'){ if (/^[1-4]$/.test(k)){ const m = burstCurrent(S.dlg), it = m && m[+k - 1]; if (it){ e.preventDefault(); openSerie(it.id); } } return; }
  if (S.dlg && S.dlg.type === 'move'){
    if (/^[1-9]$/.test(k)){ const t = moveTargets()[+k - 1]; if (t){ e.preventDefault(); S.dlg.target = t.p; renderDlg(); } }
    else if (k === 'Enter' && tg.tagName !== 'BUTTON' && S.dlg.target){ e.preventDefault(); doMove(S.dlg); } return;
  }
  if (S.dlg) return;
  if (mod && k.toLowerCase() === 'z'){ e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && k.toLowerCase() === 'y'){ e.preventDefault(); redo(); return; }
  if (!S.folderPath) return;
  if (mod && k.toLowerCase() === 'a' && !S.loupe){ e.preventDefault(); if (!S.selMode){ S.selMode = true; } S.view.forEach(i => S.sel.add(i.id)); $('grid').classList.add('selmode'); selChanged(); return; }
  if (mod) return;
  const ids = targetIds();
  if (S.loupe){
    if (k === 'ArrowLeft'){ e.preventDefault(); step(-1); return; } if (k === 'ArrowRight'){ e.preventDefault(); step(1); return; }
    if (k === ' '){ e.preventDefault(); toggleZoom(); return; }
    if (k.toLowerCase() === 'f'){ e.preventDefault(); setImmersive(!L.immersive); return; }
    if (k.toLowerCase() === 'i'){ e.preventDefault(); A.infoToggle(); return; }
  } else if (k.startsWith('Arrow')){
    const ids2 = S.view.map(i => i.id); if (!ids2.length) return; e.preventDefault();
    let i = Math.max(0, ids2.indexOf(S.focusId)); const first = tileEls.get(ids2[0]), cols = Math.max(1, Math.round($('grid').clientWidth / (first ? first.offsetWidth + 8 : 168)));
    i = clamp(i + (k === 'ArrowLeft' ? -1 : k === 'ArrowRight' ? 1 : k === 'ArrowUp' ? -cols : cols), 0, ids2.length - 1);
    setFocus(ids2[i]); const el = tileEls.get(ids2[i]); if (el){ el.focus(); el.scrollIntoView({block:'nearest'}); } return;
  } else if (k === 'Enter' && !(tg.classList && tg.classList.contains('tile')) && S.focusId){ openLoupe(S.focusId); return; }
  if (/^[0-5]$/.test(k)){ if (ids.length) change(ids, 'rating', +k); return; }
  const lk = k.toLowerCase();
  if (lk === 'p'){ S.loupe ? loupeDecide('pick') : ids.length && change(ids, 'flag', 'pick'); return; }
  if (lk === 'x'){ S.loupe ? loupeDecide('reject') : ids.length && change(ids, 'flag', 'reject'); return; }
  if (lk === 'u'){ ids.length && change(ids, 'flag', 'none'); return; }
  if (lk === 'm'){ e.preventDefault(); openMove(ids); return; }
  const lab = LABELS.find(l => l.key === k); if (lab){ ids.length && toggleLabel(ids, lab.id); return; }
  if (k === 'Delete' || k === 'Backspace'){ e.preventDefault(); openDelete(ids); }
});

/* ---------- folder loading / boot ---------- */
function loadFolder(path){
  S.folderPath = path; S.items = S.folders[path] || (S.folders[path] = genFolder(path)); S.byId = new Map(S.items.map(i => [i.id, i]));
  S.sel.clear(); S.selMode = false; S.filters = DEF_FILTERS(); S.focusId = null; S.undo = []; S.redo = [];
  closeDlg(); $('gridWrap').scrollTop = 0; resetBar(); refreshView(); renderHeader();
  if (S.server.resume[path] && S.byId.has(S.server.resume[path])) toast('Continue where you left off', false, {act:'resume', label:'Resume'});
}
/* ---------- resizable panels ---------- */
function bindDivider(el, {get, set, min, max, sign}){
  let x0 = 0, w0 = 0;
  const move = e => { set(clamp(w0 + sign * (e.clientX - x0) / (S.scale || 1), min, max), true); };
  el.addEventListener('pointerdown', e => { x0 = e.clientX; w0 = get(); el.setPointerCapture(e.pointerId); el.classList.add('drag'); el.addEventListener('pointermove', move); e.preventDefault(); });
  const end = () => { el.classList.remove('drag'); el.removeEventListener('pointermove', move); savePrefs(); if (S.loupe){ measure(); showLoupe(); } };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
  el.addEventListener('keydown', e => { const d = e.key === 'ArrowLeft' ? -16 : e.key === 'ArrowRight' ? 16 : 0; if (!d) return; e.preventDefault(); set(clamp(get() + sign * d, min, max), false); });
}
function setNavW(v){ P0.navW = v; $('frame').style.setProperty('--navw', v + 'px'); savePrefs(); }
function setInfoW(v, live){ P0.infoW = v; $('loupe').style.setProperty('--infow', v + 'px'); if (!live){ savePrefs(); if (S.loupe){ measure(); showLoupe(); } } }
function setImmersive(on){
  const lo = $('loupe'); if (lo.hidden) return; L.immersive = on; lo.classList.toggle('immersive', on);
  if (on) toast('Chrome hidden · double-tap or F to show');
  measure(); showLoupe();
}
function boot(){
  $('frame').style.setProperty('--navw', P0.navW + 'px'); $('loupe').style.setProperty('--infow', P0.infoW + 'px');
  bindDivider($('navDiv'), {get:() => P0.navW, set:setNavW, min:180, max:420, sign:1});
  applyTheme(); $('logo').innerHTML = logoSVG() + '<span>honeycomb</span>'; document.body.classList.toggle('noq', !S.mock.showQ);
  renderNav(); renderHeader(); renderMock(); layoutFrame(); $('grid').style.setProperty('--ts', S.ts + 'px');
  refreshView(); openDlg({type:'picker', cwd:'/Photos/2026', sel:null});
}
bindGrid();
new ResizeObserver(() => applyBar()).observe($('toolbar'));
new ResizeObserver(() => { if (S.loupe) { measure(); showLoupe(); } onFrameResize(); }).observe($('frame'));
addEventListener('resize', () => { if (S.mock.frame !== 'off') layoutFrame(); });
boot();
</script>
