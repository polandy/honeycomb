<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tile info button on touch (GRID-004.12)</title>
<style>
body { margin: 0; padding: 16px; font: 14px system-ui, sans-serif; background: #f5f5f5; color: #222; }
.grid { display: grid; grid-template-columns: repeat(3, 110px); gap: 8px; margin-top: 12px; }
.tile { position: relative; overflow: hidden; border-radius: 10px; background: #e4e4e4; display: flex; flex-direction: column; height: 134px; }
.name { height: 24px; line-height: 24px; padding: 0 44px 0 8px; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.photo { flex: 1; background: linear-gradient(135deg, #c9a15a, #6b7f5e); }
/* 44 x 44 hit area, the icon sits in the name bar's right end */
.info { position: absolute; top: 0; right: 0; width: 44px; height: 44px; padding: 4px 0 0; border: 0; background: none; display: flex; justify-content: center; align-items: flex-start; color: inherit; }
.info svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
.bubble { position: absolute; left: 8px; top: 164px; width: 200px; padding: 8px 10px; border-radius: 8px; background: #222; color: #fff; font-size: 12px; box-shadow: 0 2px 8px rgba(0, 0, 0, .3); display: none; }
.bubble::before { content: ''; position: absolute; top: -5px; right: 30px; border: 5px solid transparent; border-top: 0; border-bottom-color: #222; }
.bubble.on { display: block; }
.bubble b { font-weight: 600; }
.legend { max-width: 360px; margin-top: 16px; }
@media (pointer: fine) { .info { display: none; } .legend::after { content: ' (A mouse shows no button; it rests on the tile for 700 ms instead.)'; } }
</style>
</head>
<body>
<h1 style="font-size: 16px; margin: 0">Show file names on touch</h1>
<div class="grid" id="grid">
  <div class="tile"><div class="name">IMG_0001</div><div class="photo"></div><button class="info" aria-label="Tile info"><svg viewBox="0 0 24 24"><path d="M12 11v6M12 7.5h.01M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z"/></svg></button></div>
  <div class="tile"><div class="name">IMG_0002</div><div class="photo"></div><button class="info" aria-label="Tile info"><svg viewBox="0 0 24 24"><path d="M12 11v6M12 7.5h.01M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z"/></svg></button></div>
  <div class="tile"><div class="name">IMG_0003</div><div class="photo"></div><button class="info" aria-label="Tile info"><svg viewBox="0 0 24 24"><path d="M12 11v6M12 7.5h.01M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z"/></svg></button></div>
</div>
<div class="bubble" id="bubble"><b>IMG_0001</b> JPG + CR3<br>Captured 2026-11-10 12:03:47<br>Camera Canon EOS R5<br>Rating ★★★☆☆</div>
<p class="legend">Tap ⓘ on a tile to open its tile info; tap ⓘ again or anywhere else to close it. A long-press elsewhere on the tile still selects it.</p>
<script>
const bubble = document.getElementById('bubble')
let opener = null
document.addEventListener('click', (event) => {
  const button = event.target.closest('.info')
  opener = button === null || button === opener ? null : button
  bubble.classList.toggle('on', opener !== null)
})
</script>
</body>
</html>
